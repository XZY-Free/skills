name: 功能请求 / Feature Request
description: 想让 skill 支持新场景、新工具、新工作流
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: 你想做什么（用例）
      description: 描述具体场景，而不是抽象需求。例如"我想让 skill 自动把 MasterGo 设计稿的颜色 token 同步到我项目的 tailwind.config.ts"
    validations:
      required: true
  - type: textarea
    id: current-workaround
    attributes:
      label: 当前怎么绕过
      description: 现在你是怎么手工搞定的？
  - type: textarea
    id: proposal
    attributes:
      label: 你的方案构想（可选）
      description: 觉得 skill 应该怎么接入这个能力？要新增什么 reference 文件 / 工具？
  - type: dropdown
    id: willing-to-pr
    attributes:
      label: 你愿意提 PR 吗？
      options:
        - "愿意，需要 maintainer 指导"
        - "愿意，能独立做"
        - "暂时不能，但希望 maintainer 看看"
    validations:
      required: true
